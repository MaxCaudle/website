version: '3.9'

services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: baking
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - '5432:5432'

  web:
    build: .
    depends_on:
      - db
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: baking
      DB_USER: postgres
      DB_PASSWORD: postgres
      LIGHT_CONTROLS_SETTINGS: /app/config.json
    ports:
      - '5000:80'
    volumes:
      - .:/app:cached
    command: ["python", "app.py"]

volumes:
  pgdata:
